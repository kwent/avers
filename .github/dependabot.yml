version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      mobile:
        patterns: ["*"]
    # The Expo SDK pins React, React Native, native modules and TypeScript to exact tested versions (expo-doctor fails
    # on any other): those only move with `npx expo install --fix`. Expo packages get their patch releases here;
    # minor/major bumps arrive with an SDK upgrade (`npx expo install expo@<sdk> --fix`).
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "typescript"
      - dependency-name: "@types/react"
      # NativeWind 4 runs on Tailwind 3; Tailwind 4 and its prettier plugin come with a NativeWind upgrade
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prettier-plugin-tailwindcss"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
