# Opens Avers in Expo Go, switches the UI to French (flows assert French copy) and lands on the Scanner tab.
appId: host.exp.Exponent
---
- openLink: exp://127.0.0.1:8081
- tapOn:
    text: "Cancel" # photo picker left open by an aborted run
    optional: true
- tapOn:
    text: "Continue" # Expo Go developer-menu onboarding, first launch only
    optional: true
- repeat: # back out of any screen a previous run stopped on
    times: 4
    while:
      notVisible:
        id: "tab-scanner"
    commands:
      - tapOn:
          text: "Retour|Back"
          optional: true
- extendedWaitUntil:
    visible:
      id: "tab-scanner"
    timeout: 60000
- tapOn:
    id: "tab-settings"
- tapOn:
    id: "language-fr"
- tapOn:
    id: "tab-scanner"
- assertVisible: "Combien vaut ma pièce ?"
