# Opens Avers in Expo Go, pointed at the throwaway test API (${API_URL}, set by scripts/e2e-ios.sh) with the UI in
# French (flows assert French copy), and lands on the Scanner tab. Development builds read both from the link.
appId: host.exp.Exponent
---
- openLink: exp://127.0.0.1:8081/--/?lang=fr&api=${encodeURIComponent(API_URL)}
- tapOn:
    text: "Cancel" # photo picker left open by an aborted run
    optional: true
- tapOn:
    text: "Continue" # Expo Go developer-menu onboarding, first launch only
    optional: true
- tapOn:
    id: "xmark" # Expo Go developer menu, opened on first launch of a fresh install
    optional: true
- repeat: # back out of any screen a previous run stopped on
    times: 4
    while:
      notVisible:
        id: "tab-scanner"
    commands:
      - tapOn:
          text: "Retour|Back"
          optional: true
- extendedWaitUntil:
    visible:
      id: "tab-scanner"
    timeout: 60000
- tapOn:
    id: "tab-scanner"
- assertVisible: "Combien vaut ma pièce ?"
