# Full journey: pick the two coin photos → estimate (real Claude call) → save → collection total → delete.
# Requires the fixture photos in the simulator library (scripts/e2e-ios.sh adds them).
appId: host.exp.Exponent
name: Estimate and collect
tags: [e2e]
---
- runFlow: subflows/open-app.yaml
- tapOn: "Choisir dans mes photos"

# One slot per side; fixtures are dated by scripts/e2e-ios.sh (front 2099-01-02, back 2099-01-01).
- tapOn:
    id: "pick-front"
- tapOn:
    text: "Photo, January 02, 2099, [^,]+"
    index: 0
- tapOn:
    id: "pick-back"
- scrollUntilVisible: # the picker lists newest first: the back fixture is third
    element:
      text: "Photo, January 01, 2099, [^,]+"
      index: 0
- tapOn:
    text: "Photo, January 01, 2099, [^,]+"
    index: 0
- tapOn: "Estimer la pièce"

- assertVisible: "Analyse de la pièce…"
- extendedWaitUntil:
    visible: "VALEUR ESTIMÉE"
    timeout: 120000
- assertVisible: ".*10 Francs.*1851.*"

# Copy: whole summary, then a single field
- tapOn:
    id: "copy-all"
- assertVisible: "Copié"
- scrollUntilVisible: # tall card, often already half on screen
    element:
      id: "catalog-match"
    visibilityPercentage: 50
    centerElement: true
- scrollUntilVisible:
    element: "VALEUR DU MÉTAL \\(MINIMUM\\)"
- scrollUntilVisible:
    element: "PRIX SELON L’ÉTAT"
- scrollUntilVisible:
    element:
      id: "price-SUP"
- scrollUntilVisible:
    element:
      id: "copy-year"
- tapOn:
    id: "copy-year"
- scrollUntilVisible:
    element: "PIÈCES COMPARABLES CHEZ LES MARCHANDS"
- scrollUntilVisible:
    element: "Ajouter à ma collection"
- tapOn: "Ajouter à ma collection"

# Item screen
- extendedWaitUntil:
    visible: "DANS MA COLLECTION"
    timeout: 15000
- tapOn: "Plus"
- assertVisible: "Total :.*"

# Collection totals
- tapOn: "Retour"
- tapOn:
    id: "tab-collection"
- assertVisible: "VALEUR DE MA COLLECTION"
- assertVisible: "2 pièces.*"
- assertVisible: "2 × .*10 Francs.*"

# Clean up
- tapOn: "2 × .*10 Francs.*"
- scrollUntilVisible: # the item page is long (estimate, prices, sources, comparables)
    element: "Retirer de ma collection"
    timeout: 60000
    speed: 80
- tapOn: "Retirer de ma collection"
- tapOn: "Retirer"
- assertVisible: "Votre collection est vide."
