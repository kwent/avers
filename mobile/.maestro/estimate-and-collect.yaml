# Full journey: pick the two coin photos → estimate (real vision-model call) → save → collection total → delete.
# Requires the fixture photos in the simulator library (scripts/e2e-ios.sh adds them).
appId: host.exp.Exponent
name: Estimate and collect
tags: [e2e]
---
- runFlow: subflows/open-app.yaml
- tapOn: "Choisir dans mes photos"

# One slot per side; fixtures are dated by scripts/e2e-ios.sh (front 2099-01-02, back 2099-01-01).
- tapOn:
    id: "pick-front"
- tapOn:
    text: "Photo, January 02, 2099, [^,]+"
    index: 0
- tapOn:
    id: "pick-back"
- scrollUntilVisible: # the picker lists newest first: the back fixture is third
    element:
      text: "Photo, January 01, 2099, [^,]+"
      index: 0
- tapOn:
    text: "Photo, January 01, 2099, [^,]+"
    index: 0
- tapOn: "Estimer la pièce"

- assertVisible: # the fast model can answer before this is checked
    text: "Analyse de la pièce…"
    optional: true
# The e2e API turns the 1851 read into 1861 (E2E_MISREAD_YEARS): no listing, so the app asks the year
- extendedWaitUntil:
    visible:
      id: "year-check"
    timeout: 120000
- assertVisible: "Est-ce bien 1861 ?"
- scrollUntilVisible: # off the sticky add bar, which would take the tap
    element:
      id: "year-1851"
    centerElement: true
- tapOn:
    id: "year-1851"
- extendedWaitUntil:
    visible: "Valeur estimée.*"
    timeout: 30000
- scrollUntilVisible: # the title, above the answer
    element: ".*10 Francs.*1851.*"
    direction: UP

# Price by grade, metal, record (copy all, then one line), catalog match
- scrollUntilVisible:
    element: "Pourquoi ce prix"
- scrollUntilVisible:
    element:
      id: "price-SUP"
- scrollUntilVisible:
    element: "Le métal"
- scrollUntilVisible:
    element:
      id: "copy-all"
- tapOn:
    id: "copy-all"
- assertVisible: "Copié"
- scrollUntilVisible:
    element:
      id: "copy-year"
- tapOn:
    id: "copy-year"
- scrollUntilVisible:
    element:
      id: "catalog-match"
    visibilityPercentage: 50
    centerElement: true
- runFlow: # the add bar sticks to the bottom; a scroll gesture above may already have tapped it
    when:
      visible: "Ajouter à ma collection"
    commands:
      - tapOn: "Ajouter à ma collection"

# Item screen
- extendedWaitUntil:
    visible: "Dans ma collection"
    timeout: 15000
- tapOn: "Plus"
- assertVisible: "Total :.*"

# Collection totals
- tapOn: "Retour"
- tapOn:
    id: "tab-collection"
- assertVisible: "Ma collection vaut environ"
- assertVisible: "2 pièces.*"
- assertVisible: "2 × .*10 Francs.*"

# Clean up
- tapOn: "2 × .*10 Francs.*"
- scrollUntilVisible: # the item page is long (estimate, prices, sources, comparables)
    element: "Retirer de ma collection"
    timeout: 60000
    speed: 80
- tapOn: "Retirer de ma collection"
- tapOn: "Retirer"
- assertVisible: "Votre collection est vide."
