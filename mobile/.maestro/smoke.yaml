# Navigation and API connectivity. No AI call.
appId: host.exp.Exponent
name: Smoke
tags: [smoke]
---
- runFlow: subflows/open-app.yaml
- assertVisible: "Photographier une pièce"
- assertVisible: "Choisir dans mes photos"

- tapOn:
    id: "tab-collection"
- assertVisible: "VALEUR DE MA COLLECTION"

- tapOn:
    id: "tab-settings"
- tapOn:
    id: "currency-EUR"
- tapOn: "Enregistrer et tester"
- extendedWaitUntil:
    visible: "Connecté ✓.*"
    timeout: 15000
