# Navigation and API connectivity. No AI call.
appId: host.exp.Exponent
name: Smoke
tags: [smoke]
---
- runFlow: subflows/open-app.yaml
- assertVisible: "Photographier une pièce"
- assertVisible: "Choisir dans mes photos"

- tapOn:
    id: "tab-collection"
- assertVisible: "Ma collection.*"

- tapOn:
    id: "tab-settings"
- tapOn:
    id: "currency-EUR"
- scrollUntilVisible: # the connection settings exist only in development builds
    element:
      id: "server-toggle"
- runFlow: # folded by default
    when:
      notVisible:
        id: "server-save"
    commands:
      - tapOn:
          id: "server-toggle"
- scrollUntilVisible: # the button can sit under the tab bar, where a tap lands on a tab
    element:
      id: "server-save"
    centerElement: true
- tapOn: "Enregistrer et tester"
- extendedWaitUntil:
    visible: "Connecté, .*"
    timeout: 15000
