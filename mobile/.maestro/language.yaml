# Language setting: English UI, then back to French. No AI call.
appId: host.exp.Exponent
name: Language
tags: [smoke]
---
- runFlow: subflows/open-app.yaml
- tapOn:
    id: "tab-settings"
- scrollUntilVisible: # the screen keeps its scroll position between runs
    element:
      id: "language-en"
    direction: UP
- tapOn:
    id: "language-en"
- assertVisible: "Language"
- assertVisible: "Automatic.*"
- tapOn:
    id: "tab-scanner"
- assertVisible: "What is my coin worth?"
- assertVisible: "Photograph a coin"
- tapOn:
    id: "tab-collection"
- assertVisible: "My collection.*"
- tapOn:
    id: "tab-settings"
- tapOn:
    id: "language-fr"
- assertVisible: "Langue"
